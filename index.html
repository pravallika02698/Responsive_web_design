<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Restaurant Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Foodie
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Restaurants</a>
            <a href="#">Orders</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
        </div>

    </nav>


    <!-- ================= HERO SECTION ================= -->

    <section class="hero">

        <h1>Delicious Food, Delivered Fast</h1>

        <p>
            Order your favorite food from nearby restaurants
        </p>

        <button class="order-btn">
            Order Now
        </button>

    </section>


    <!-- ================= RESTAURANTS SECTION ================= -->

    <section class="restaurants">

        <h2>Popular Restaurants</h2>

        <div class="restaurant-container">

            <!-- Restaurant 1 -->

            <div class="restaurant-card">

                <h3>Restaurant 1</h3>

                <div class="rating">
                    <span>★</span> 4.5
                </div>

                <a href="#" class="menu-btn">
                    View Menu
                </a>

            </div>


            <!-- Restaurant 2 -->

            <div class="restaurant-card">

                <h3>Restaurant 2</h3>

                <div class="rating">
                    <span>★</span> 4.3
                </div>

                <a href="#" class="menu-btn">
                    View Menu
                </a>

            </div>


            <!-- Restaurant 3 -->

            <div class="restaurant-card">

                <h3>Restaurant 3</h3>

                <div class="rating">
                    <span>★</span> 4.7
                </div>

                <a href="#" class="menu-btn">
                    View Menu
                </a>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Foodie. All rights reserved.
        </p>

    </footer>

</body>
</html>
